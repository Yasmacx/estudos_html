<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula sobre Video</title>
</head>
<body>
    <h1>Videos</h1>
    <video width="800" height="450" controls poster=".jpg">
        <source src="see you again.mp4" type="video/mp4">
        <source src="see you again.webm" type="video/webm">
        <source src="see you again.ogg" type="video/ogg">
        <p>Seu navegador não suporta o elemento de vídeo.</p>
    <video>
    <audio controls>
        <source src="see you again.mp3" type="audio/mpeg">
        <source src="see you again.ogg" type="audio/ogg">
        <p>Seu navegador não suporta o elemento de áudio.</p>
    </audio>
    <h1>Audio</h1>
    <audio id="player" preload="meladala"
        <source src="see you again.mp3" type="audio/mpeg">
    </audio>
    <div>
        <button onclick="playPause()">▶️/⏸️</button>
        input type="range" id="progress" min="0" max="100" value="0">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>

</body>
</html>
